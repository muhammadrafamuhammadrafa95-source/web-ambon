<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Mochamad Rafa W</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #16002b, #5e00a8, #9b30ff);
            color: white;
            text-align: center;
        }

        /* HEADER */
        header {
            padding: 25px;
            background: rgba(0, 0, 0, 0.25);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 35px;
            color: #ffffff;
            text-shadow: 0 0 15px #d58aff;
        }

        header p {
            margin-top: 8px;
            color: #e8caff;
            font-size: 18px;
        }

        /* GAME INFO */
        .info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .box {
            background: rgba(255,255,255,0.12);
            padding: 15px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .box span {
            display: block;
            font-size: 28px;
            font-weight: bold;
            color: #e0a8ff;
        }

        /* GAME AREA */
        #gameArea {
            width: 90%;
            max-width: 900px;
            height: 500px;
            margin: auto;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);

            background-size: 25px 25px;

            border: 3px solid #d38aff;
            border-radius: 25px;

            box-shadow:
                0 0 20px #b000ff,
                inset 0 0 40px rgba(0,0,0,0.4);
        }

        /* BOLA */
        #ball {
            width: 65px;
            height: 65px;

            position: absolute;

            border-radius: 50%;

            background: radial-gradient(
                circle at 30% 30%,
                #ffffff,
                #d66cff 40%,
                #7800ff
            );

            box-shadow:
                0 0 15px #ffffff,
                0 0 35px #b000ff;

            cursor: pointer;

            display: none;

            transition: transform 0.1s;
        }

        #ball:hover {
            transform: scale(1.15);
        }

        /* START BUTTON */
        button {
            margin: 25px;
            padding: 15px 40px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #8a00ff,
                #d15cff
            );

            color: white;
            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 15px #a000ff;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 30px #d000ff;
        }

        /* PESAN */
        #message {
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
            color: #f0d7ff;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            color: #d7b5e8;
        }

        /* HP */
        @media(max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            #gameArea {
                height: 400px;
            }

            #ball {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>🎮 GAME ZONE</h1>

        <p>
            Dibuat oleh <b>Mochamad Rafa W</b>
        </p>

    </header>


    <!-- INFO GAME -->
    <div class="info">

        <div class="box">
            SCORE
            <span id="score">0</span>
        </div>

        <div class="box">
            WAKTU
            <span id="time">30</span>
        </div>

        <div class="box">
            HIGH SCORE
            <span id="highScore">0</span>
        </div>

    </div>


    <!-- GAME -->
    <div id="gameArea">

        <div id="ball"></div>

    </div>


    <!-- BUTTON -->
    <button onclick="startGame()">
        🚀 MULAI GAME
    </button>


    <div id="message">
        Tekan tombol untuk mulai!
    </div>


    <footer>
        © 2026 Mochamad Rafa W
    </footer>


    <script>

        const gameArea = document.getElementById("gameArea");
        const ball = document.getElementById("ball");

        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const highScoreText = document.getElementById("highScore");
        const message = document.getElementById("message");

        let score = 0;
        let time = 30;
        let gameRunning = false;

        let timer;


        /* MULAI GAME */
        function startGame() {

            score = 0;
            time = 30;

            scoreText.textContent = score;
            timeText.textContent = time;

            gameRunning = true;

            ball.style.display = "block";

            message.textContent = "🔥 Tangkap bolanya!";

            moveBall();

            clearInterval(timer);

            timer = setInterval(() => {

                time--;

                timeText.textContent = time;

                if (time <= 0) {

                    endGame();

                }

            }, 1000);
        }


        /* PINDAHKAN BOLA */
        function moveBall() {

            const maxX =
                gameArea.clientWidth - ball.offsetWidth;

            const maxY =
                gameArea.clientHeight - ball.offsetHeight;

            const x =
                Math.random() * maxX;

            const y =
                Math.random() * maxY;

            ball.style.left = x + "px";
            ball.style.top = y + "px";
        }


        /* KLIK BOLA */
        ball.addEventListener("click", () => {

            if (!gameRunning) return;

            score++;

            scoreText.textContent = score;

            moveBall();

            /* Setiap 5 poin bola mengecil */
            if (score % 5 === 0) {

                let size =
                    Math.max(35, 65 - score);

                ball.style.width = size + "px";
                ball.style.height = size + "px";
            }
        });


        /* GAME SELESAI */
        function endGame() {

            gameRunning = false;

            clearInterval(timer);

            ball.style.display = "none";

            message.textContent =
                "🏆 GAME SELESAI! Score kamu: " + score;

            let highScore =
                localStorage.getItem("rafaHighScore") || 0;

            if (score > highScore) {

                highScore = score;

                localStorage.setItem(
                    "rafaHighScore",
                    highScore
                );

                message.textContent =
                    "🔥 HIGH SCORE BARU! " + score;
            }

            highScoreText.textContent = highScore;
        }


        /* LOAD HIGH SCORE */
        window.onload = () => {

            highScoreText.textContent =
                localStorage.getItem("rafaHighScore") || 0;

        };

    </script>

</body>
</html>
