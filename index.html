<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochamad Rafa W</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 45%, #30004f 0%, #10001d 45%, #050008 100%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .container {
            min-height: 100vh;
            padding: 25px 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Tulisan atas */
        .top {
            position: absolute;
            top: 10px;
            left: 5%;
            color: #c678ff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 10px;
            text-shadow: 0 0 15px #9b00ff;
        }

        /* Nama */
        .name {
            text-transform: uppercase;
            font-weight: 1000;
            line-height: 0.85;
            letter-spacing: -5px;
        }

        .first {
            font-size: clamp(60px, 12vw, 170px);
            color: white;
            text-shadow:
                0 0 10px rgba(255,255,255,.4),
                0 0 35px rgba(160,0,255,.3);
        }

        .second {
            font-size: clamp(80px, 15vw, 210px);
            color: #bd6cff;
            text-shadow:
                0 0 15px #8c00ff,
                0 0 45px rgba(155,0,255,.7);
        }

        /* Garis dekorasi */
        .line {
            width: 180px;
            height: 5px;
            margin-top: 35px;
            background: linear-gradient(
                90deg,
                #7b00ff,
                #d080ff,
                transparent
            );
            box-shadow: 0 0 20px #a000ff;
        }

        .subtitle {
            margin-top: 18px;
            font-size: 18px;
            letter-spacing: 5px;
            color: #bda5c9;
        }

        /* Efek lingkaran */
        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: #7b00ff;
            filter: blur(180px);
            opacity: .18;
            right: -180px;
            bottom: -200px;
            pointer-events: none;
        }

        .glow2 {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #b000ff;
            filter: blur(150px);
            opacity: .15;
            left: -150px;
            top: -100px;
            pointer-events: none;
        }

        /* Animasi */
        .name {
            animation: muncul 1.2s ease-out;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateX(-60px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        @media(max-width: 700px) {

            .top {
                font-size: 13px;
                letter-spacing: 5px;
            }

            .name {
                letter-spacing: -3px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="container">

        <div class="top">
            FOOTBALL • RAFA • FAN PAGE
        </div>

        <div class="name">

            <div class="first">
                MOCHAMAD
            </div>

            <div class="second">
                RAFA W
            </div>

        </div>

        <div class="line"></div>

        <div class="subtitle">
            MICHAEL OLISE • FOOTBALL • PURPLE VIBES
        </div>

    </div>

</body>
</html>
