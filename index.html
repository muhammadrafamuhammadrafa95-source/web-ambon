<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochamad Rafa W</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #24004d, #6a0dad, #a855f7);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(20, 0, 40, 0.75);
            border: 2px solid #c084fc;
            border-radius: 25px;
            box-shadow: 0 0 30px #a855f7;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px #d8b4fe;
        }

        .quote {
            font-size: 22px;
            font-style: italic;
            line-height: 1.6;
            color: #e9d5ff;
        }

        .line {
            width: 100px;
            height: 4px;
            background: #c084fc;
            margin: 25px auto;
            border-radius: 10px;
            box-shadow: 0 0 15px #c084fc;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #d8b4fe;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Mochamad Rafa W</h1>

        <div class="line"></div>

        <p class="quote">
            "Jadilah orang baik,<br>
            dan tinggalkan kebaikan setelahmu."
        </p>

        <footer>
            ✦ Keep being a good person ✦
        </footer>
    </div>

</body>
</html>
