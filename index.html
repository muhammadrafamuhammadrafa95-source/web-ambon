<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafa Shooter Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at center, #5b168f, #1a032b 65%, #08000f);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,.3);
            border-bottom: 2px solid #b85cff;
        }

        header h1 {
            color: #e0a3ff;
            text-shadow: 0 0 15px #a020f0;
        }

        header p {
            margin-top: 5px;
            color: #d9b5ed;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255,255,255,.1);
            border: 1px solid #a947e8;
            border-radius: 12px;
            padding: 10px 25px;
            text-align: center;
            box-shadow: 0 0 12px rgba(170,0,255,.3);
        }

        .stat b {
            display: block;
            color: #e19aff;
            font-size: 24px;
        }

        #game {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 570px;
            margin: auto;
            overflow: hidden;

            border: 3px solid #c05cff;
            border-radius: 20px;

            background:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);

            background-size: 35px 35px;

            box-shadow:
                0 0 30px #7d00b8,
                inset 0 0 80px rgba(0,0,0,.6);

            cursor: crosshair;
        }

        /* TARGET */
        .target {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    white 0 12%,
                    #ff4dff 13% 35%,
                    #8d00ff 36% 65%,
                    #300050 66%
                );

            box-shadow:
                0 0 10px white,
                0 0 30px #d000ff;

            cursor: crosshair;

            animation: pulse .7s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.08);
            }
        }

        /* PELURU */
        .bullet {
            position: absolute;
            width: 8px;
            height: 25px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px #d87aff;
            pointer-events: none;
        }

        /* LEDAKAN */
        .boom {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 5px solid #f0a0ff;
            border-radius: 50%;
            pointer-events: none;
            animation: boom .35s forwards;
        }

        @keyframes boom {
            from {
                transform: scale(.2);
                opacity: 1;
            }
            to {
                transform: scale(2);
                opacity: 0;
            }
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 13px 35px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(90deg, #7500d9, #c04cff);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 20px #9d00ff;
        }

        button:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px #d000ff;
        }

        #message {
            text-align: center;
            font-weight: bold;
            color: #e6c5ff;
        }

        .crosshair {
            position: fixed;
            pointer-events: none;
            font-size: 30px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🎯 RAFA SHOOTER</h1>
    <p>Game Tembak Target • Mochamad Rafa W</p>
</header>

<div class="info">

    <div class="stat">
        SCORE
        <b id="score">0</b>
    </div>

    <div class="stat">
        LEVEL
        <b id="level">1</b>
    </div>

    <div class="stat">
        TARGET
        <b id="targetCount">10</b>
    </div>

    <div class="stat">
        WAKTU
        <b id="time">30</b>
    </div>

</div>

<div id="game"></div>

<button onclick="startGame()">🔫 MULAI GAME</button>

<div id="message">
    Klik MULAI GAME untuk bermain!
</div>

<script>

const game = document.getElementById("game");

const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const targetText = document.getElementById("targetCount");
const timeText = document.getElementById("time");
const message = document.getElementById("message");

let score = 0;
let level = 1;
let targetCount = 10;
let time = 30;

let playing = false;
let timer;
let targetTimer;


/* MULAI GAME */
function startGame() {

    score = 0;
    level = 1;
    targetCount = 10;
    time = 30;

    playing = true;

    scoreText.textContent = score;
    levelText.textContent = level;
    targetText.textContent = targetCount;
    timeText.textContent = time;

    message.textContent = "🎯 Hancurkan semua target!";

    game.innerHTML = "";

    createTarget();

    clearInterval(timer);

    timer = setInterval(() => {

        time--;

        timeText.textContent = time;

        if (time <= 0) {
            gameOver();
        }

    }, 1000);
}


/* BUAT TARGET */
function createTarget() {

    if (!playing) return;

    const target = document.createElement("div");

    target.className = "target";

    const maxX = game.clientWidth - 65;
    const maxY = game.clientHeight - 65;

    target.style.left =
        Math.random() * maxX + "px";

    target.style.top =
        Math.random() * maxY + "px";

    target.addEventListener("click", function(e) {

        e.stopPropagation();

        shootEffect(
            target.offsetLeft + 30,
            target.offsetTop + 30
        );

        target.remove();

        score++;

        targetCount--;

        scoreText.textContent = score;
        targetText.textContent = targetCount;

        /* Naik level setiap 10 poin */
        if (score % 10 === 0) {

            level++;

            levelText.textContent = level;

            message.textContent =
                "🔥 LEVEL " + level + "!";
        }

        if (targetCount <= 0) {

            targetCount = 10 + level * 2;

            targetText.textContent = targetCount;
        }

        createTarget();

    });

    game.appendChild(target);
}


/* EFEK TEMBAKAN */
function shootEffect(x, y) {

    const boom = document.createElement("div");

    boom.className = "boom";

    boom.style.left = (x - 25) + "px";
    boom.style.top = (y - 25) + "px";

    game.appendChild(boom);

    setTimeout(() => {
        boom.remove();
    }, 350);
}


/* KLIK AREA = TEMBAK */
game.addEventListener("click", function(e) {

    if (!playing) return;

    const rect = game.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    /* Efek peluru */
    const bullet = document.createElement("div");

    bullet.className = "bullet";

    bullet.style.left = x + "px";
    bullet.style.top = y + "px";

    game.appendChild(bullet);

    setTimeout(() => {
        bullet.remove();
    }, 150);

});


/* GAME OVER */
function gameOver() {

    playing = false;

    clearInterval(timer);

    game.innerHTML = "";

    message.innerHTML =
        "🏆 GAME SELESAI! Score kamu: <b>" +
        score +
        "</b> — Klik MULAI GAME untuk main lagi.";

}


/* TARGET BERGERAK */
setInterval(() => {

    if (!playing) return;

    const target =
        document.querySelector(".target");

    if (!target) return;

    const maxX = game.clientWidth - 65;
    const maxY = game.clientHeight - 65;

    target.style.left =
        Math.random() * maxX + "px";

    target.style.top =
        Math.random() * maxY + "px";

}, 900);

</script>

</body>
</html>
