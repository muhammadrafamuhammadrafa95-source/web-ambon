<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafa Basketball Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at 50% 30%, #7b20b8, #26003d 55%, #08000d);
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,.3);
            border-bottom: 2px solid #c65cff;
        }

        header h1 {
            font-size: 30px;
            color: #f0c4ff;
            text-shadow: 0 0 15px #b000ff;
        }

        header p {
            margin-top: 5px;
            color: #dcb8ed;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .stat {
            min-width: 120px;
            padding: 10px 20px;
            text-align: center;
            border-radius: 14px;
            background: rgba(255,255,255,.1);
            border: 1px solid #bd55ed;
            box-shadow: 0 0 15px rgba(180,0,255,.25);
        }

        .stat span {
            display: block;
            margin-top: 4px;
            font-size: 25px;
            font-weight: bold;
            color: #e6a8ff;
        }

        #court {
            position: relative;
            width: 92%;
            max-width: 1000px;
            height: 560px;
            margin: auto;
            overflow: hidden;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,.04),
                    rgba(80,0,120,.3)
                );

            border: 3px solid #d06cff;
            border-radius: 20px;

            box-shadow:
                0 0 35px #8700bd,
                inset 0 0 80px rgba(0,0,0,.5);
        }

        /* LANTAI */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: linear-gradient(
                #6c1c91,
                #35104a
            );
            border-top: 3px solid #d17cff;
        }

        /* RING */
        .hoop {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 15px;
            background: #ff6b1a;
            border-radius: 20px;
            box-shadow: 0 0 15px #ff6b1a;
        }

        .backboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 75px;
            border: 5px solid white;
            border-radius: 8px;
            background: rgba(255,255,255,.08);
        }

        .net {
            position: absolute;
            top: 87px;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            height: 65px;
            border-left: 3px dashed white;
            border-right: 3px dashed white;
            border-bottom: 3px dashed white;
            border-radius: 0 0 50px 50px;
            opacity: .7;
        }

        /* BOLA */
        #ball {
            position: absolute;
            width: 55px;
            height: 55px;
            left: 50%;
            bottom: 45px;
            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffb13b,
                    #e66b00 60%,
                    #9e3600
                );

            box-shadow:
                0 0 10px #ff9d32,
                0 0 25px rgba(255,100,0,.5);

            cursor: grab;
            z-index: 5;
        }

        /* GARIS LAPANGAN */
        .line {
            position: absolute;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            width: 300px;
            height: 70px;
            border: 3px solid rgba(255,255,255,.3);
            border-bottom: none;
            border-radius: 160px 160px 0 0;
        }

        /* TOMBOL */
        button {
            display: block;
            margin: 15px auto;

            padding: 13px 35px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #7500d9,
                #d34cff
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 20px #9d00ff;
        }

        button:hover {
            transform: scale(1.07);
            box-shadow: 0 0 35px #d000ff;
        }

        #message {
            text-align: center;
            min-height: 25px;
            color: #e7caff;
            font-weight: bold;
        }

        /* ANIMASI BOLA */
        @keyframes scorePop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }

        .score-pop {
            animation: scorePop .3s;
        }

        @media(max-width: 600px) {

            #court {
                height: 470px;
            }

            .backboard {
                width: 140px;
            }

            .hoop {
                width: 130px;
            }

            .net {
                width: 75px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏀 RAFA BASKETBALL</h1>
    <p>Basket Game • Mochamad Rafa W</p>
</header>


<div class="stats">

    <div class="stat">
        SCORE
        <span id="score">0</span>
    </div>

    <div class="stat">
        COMBO
        <span id="combo">0</span>
    </div>

    <div class="stat">
        WAKTU
        <span id="time">30</span>
    </div>

</div>


<div id="court">

    <div class="backboard"></div>

    <div class="hoop"></div>

    <div class="net"></div>

    <div class="line"></div>

    <div class="floor"></div>

    <div id="ball"></div>

</div>


<button onclick="startGame()">
    🏀 MULAI GAME
</button>


<div id="message">
    Klik MULAI GAME lalu lempar bola ke ring!
</div>


<script>

const court = document.getElementById("court");
const ball = document.getElementById("ball");

const scoreText = document.getElementById("score");
const comboText = document.getElementById("combo");
const timeText = document.getElementById("time");
const message = document.getElementById("message");

let score = 0;
let combo = 0;
let time = 30;

let playing = false;
let timer;

let dragging = false;
let startX = 0;
let startY = 0;


/* MULAI GAME */
function startGame() {

    score = 0;
    combo = 0;
    time = 30;

    scoreText.textContent = score;
    comboText.textContent = combo;
    timeText.textContent = time;

    playing = true;

    message.textContent =
        "🏀 Tarik bola ke bawah lalu lepaskan ke arah ring!";

    resetBall();

    clearInterval(timer);

    timer = setInterval(() => {

        time--;

        timeText.textContent = time;

        if (time <= 0) {

            playing = false;

            clearInterval(timer);

            message.textContent =
                "🏆 GAME SELESAI! Score: " + score;

        }

    }, 1000);
}


/* POSISI AWAL BOLA */
function resetBall() {

    ball.style.transition = "none";

    ball.style.left =
        "50%";

    ball.style.bottom =
        "45px";

    ball.style.transform =
        "translateX(-50%) scale(1)";
}


/* MULAI DRAG */
ball.addEventListener("pointerdown", function(e) {

    if (!playing) return;

    dragging = true;

    startX = e.clientX;
    startY = e.clientY;

    ball.setPointerCapture(e.pointerId);

});


/* GERAKKAN BOLA */
ball.addEventListener("pointermove", function(e) {

    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    const distance =
        Math.min(Math.max(-dy, 0), 300);

    ball.style.transform =
        `translateX(-50%) translateY(${-distance}px) scale(.9)`;

});


/* LEMPAR BOLA */
ball.addEventListener("pointerup", function(e) {

    if (!dragging) return;

    dragging = false;

    const power =
        Math.min(
            Math.max(startY - e.clientY, 80),
            400
        );

    shootBall(power);

});


/* TEMBAK / LEMPAR */
function shootBall(power) {

    ball.style.transition =
        "all .7s cubic-bezier(.2,.8,.3,1)";

    const targetX =
        (court.clientWidth / 2) - 27;

    const targetY = 55;

    ball.style.left =
        targetX + "px";

    ball.style.bottom =
        (court.clientHeight - targetY) + "px";

    ball.style.transform =
        "translateX(0) scale(.75)";

    setTimeout(() => {

        checkScore(power);

    }, 700);
}


/* CEK MASUK RING */
function checkScore(power) {

    /*
        Semakin besar power,
        semakin besar kemungkinan masuk.
    */

    const chance =
        Math.random();

    const success =
        power >= 120 && chance < .75;

    if (success) {

        score += 2;
        combo++;

        scoreText.textContent = score;
        comboText.textContent = combo;

        scoreText.classList.remove("score-pop");

        void scoreText.offsetWidth;

        scoreText.classList.add("score-pop");

        message.textContent =
            combo >= 3
            ? "🔥 HOT STREAK! +2 POINT!"
            : "🏀 MASUK! +2 POINT!";

    } else {

        combo = 0;

        comboText.textContent = combo;

        message.textContent =
            "❌ Meleset! Coba atur kekuatan lemparan.";

    }

    setTimeout(() => {

        resetBall();

    }, 500);
}


/* KALAU POINTER DILEPAS DI LUAR */
ball.addEventListener("pointercancel", function() {

    dragging = false;

    resetBall();

});

</script>

</body>
</html>
